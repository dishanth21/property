{% extends 'base/base.html' %}
{% load static %}

{% block title %}Profile - PropertyPortal{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row">
        <div class="col-12">
            <h2>Profile</h2>
            <p>Welcome, {{ user.username }}!</p>
            <p>Email: {{ user.email }}</p>
            <p>Is Host: {{ user.is_host }}</p>
            <p>Is Buyer: {{ user.is_buyer }}</p>
        </div>
    </div>
</div>
{% endblock %}
